<div class="flex flex-col gap-5 p-5">
  <out-color-picker [(color)]="color" />

  <p class="text-sm">
    {{ i18n.homeLayout.selectedColor }}: <strong>{{ color() }}</strong>
  </p>

  <div class="flex items-center justify-end gap-2">
    <button class="btn btn-soft btn-error" (click)="onClose()">{{ i18n.common.close }}</button>
    <button class="btn btn-soft btn-success" [disabled]="!color()" (click)="onClose(color())">
      {{ i18n.common.apply }}
    </button>
  </div>
</div>
