<div class="picker">
  <chrome-picker [control]="colorControl">
    <div class="buttons">
      <button type="button" class="btn btn-primary" (click)="applyClick($event)">Apply</button>
      <button type="button" class="btn btn-error" (click)="discardClick($event)">Discard</button>
    </div>
  </chrome-picker>
</div>
