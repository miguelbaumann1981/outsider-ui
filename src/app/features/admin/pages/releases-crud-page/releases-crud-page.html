<div class="flex flex-col gap-4">
  <out-subtitle-page [text]="i18n.menu.releasesCrud" [icon]="'people_alt'" />

  <form [formRoot]="releasesForm" (submit)="onSubmit($event)">
    <div class="flex flex-col gap-4">
      <fieldset class="fieldset w-full">
        <legend class="fieldset-legend text-sm lg:text-base">
          {{ i18n.aboutUs.collaboratorNameLabel }}
          <span class="text-error">*</span>
        </legend>

        <input
          type="text"
          class="input w-full"
          [placeholder]="i18n.aboutUs.collaboratorNamePlaceholder"
        />
      </fieldset>
    </div>
  </form>
</div>
