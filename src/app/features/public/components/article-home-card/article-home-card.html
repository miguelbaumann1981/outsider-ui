<div
  class="mb-4 cursor-pointer overflow-hidden rounded-lg bg-white shadow-md transition-all transition-discrete hover:shadow-xl md:mb-10"
  /* [style.backgroundColor]="article()?.hoverColor" */
>
  <div class="flex flex-col gap-5">
    <div class="w-full">
      <img
        [src]="article()?.imageUrl"
        class="w-full rounded-t-lg"
        appImgFallback="/assets/foto-libros.jpg"
      />
      <div class="h-[6px] w-full" [style.backgroundColor]="article()?.color"></div>
    </div>

    <div class="flex min-h-[200px] flex-col justify-between gap-8 px-6 pb-6">
      <h2
        class="special-elite-regular flex w-full items-center justify-center text-center text-lg lg:text-3xl xl:mt-3"
      >
        {{ article()?.name }}
      </h2>

      <div class="flex flex-col items-start gap-2">
        <h3 class="text-secondary text-base font-bold lg:text-2xl">{{ article()?.title }}</h3>
        <div class="h-[2px] w-[30px]" [style.backgroundColor]="article()?.color"></div>
        <p class="text-sm font-semibold">{{ article()?.author }}</p>
      </div>
    </div>
  </div>
</div>
