<div class="flex items-center justify-between">
  <div class="flex items-start gap-3">
    @if (icon()) {
      <span class="material-icons icon-book {{ color }}"> {{ icon() }} </span>
    }
    <h2 class="special-elite-regular text-2xl font-semibold lg:text-4xl">{{ text() }}</h2>
  </div>

  <button class="btn btn-ghost text-primary" (click)="return.emit()">
    <span class="material-icons"> arrow_back </span>
    <span>{{ i18n.common.back }}</span>
  </button>
</div>
