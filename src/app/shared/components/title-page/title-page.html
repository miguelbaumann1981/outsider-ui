<div class="flex flex-row items-center justify-between gap-3">
  <div class="flex items-start gap-3">
    @if (icon()) {
      <span class="material-icons icon-book" [style.color]="colorIcon()"> {{ icon() }} </span>
    }
    <h2 class="special-elite-regular text-xl font-semibold lg:text-4xl">{{ text() }}</h2>
  </div>

  <button class="btn btn-ghost text-primary" (click)="return.emit()">
    <span class="material-icons"> arrow_back </span>
    <span class="hidden lg:inline-flex">{{ i18n.common.back }}</span>
  </button>
</div>
